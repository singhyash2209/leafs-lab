name: Daily NHL API refresh
on:
  schedule:
    - cron: '17 6 * * *'
      timezone: America/Toronto
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-refresh.yml'
      - 'scripts/**'
      - 'leafslab/**'
      - 'config.json'
      - 'requirements.txt'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: leafs-lab-publication
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore historical NHL API cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nhl-schedules-v1-${{ hashFiles('config.json') }}-${{ github.run_id }}
          restore-keys: nhl-schedules-v1-${{ hashFiles('config.json') }}-
      - name: Refresh, validate and build dashboard
        run: python scripts/scheduled_refresh.py
      - name: Preserve published snapshot in GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs outputs/artifact.json outputs/forecast.json outputs/forecast.csv outputs/refresh_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified NHL forecast and season archive'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
